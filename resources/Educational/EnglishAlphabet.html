<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>English Alphabet with sounds. For Educational use</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 24px 16px 48px;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #f6f9ff 0%, #eaf3ff 100%);
			color: #1a2b4a;
			min-height: 100vh;
		}

		header {
			text-align: center;
			margin-bottom: 28px;
		}

		h1 {
			font-size: clamp(1.4rem, 4vw, 2.2rem);
			margin: 0 0 8px;
			color: #1d3a73;
		}

		p.subtitle {
			margin: 0;
			color: #4a5e85;
			font-size: 0.95rem;
		}

		.controls {
			max-width: 1100px;
			margin: 0 auto 20px;
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			align-items: center;
			justify-content: center;
			background: #ffffff;
			padding: 12px 16px;
			border-radius: 12px;
			border: 1px solid #cfd9ee;
			box-shadow: 0 2px 6px rgba(20, 40, 80, 0.05);
		}

		.controls label {
			font-weight: 600;
			color: #1d3a73;
			font-size: 0.95rem;
		}

		.controls select {
			font-size: 0.95rem;
			padding: 6px 10px;
			border-radius: 8px;
			border: 1px solid #cfd9ee;
			background: #f6f9ff;
			color: #1a2b4a;
			cursor: pointer;
			min-width: 220px;
		}

		.controls select:focus-visible {
			outline: 3px solid #4a78d6;
			outline-offset: 2px;
		}

		.controls .preview-btn {
			font-size: 0.9rem;
			padding: 6px 14px;
			border-radius: 8px;
			border: 1px solid #4a78d6;
			background: #4a78d6;
			color: #ffffff;
			cursor: pointer;
			transition: background 120ms ease;
		}

		.controls .preview-btn:hover {
			background: #3a66c0;
		}

		.alphabet {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
			gap: 14px;
			max-width: 1100px;
			margin: 0 auto;
		}

		.letter {
			background: #ffffff;
			border: 2px solid #cfd9ee;
			border-radius: 14px;
			padding: 18px 8px;
			text-align: center;
			cursor: pointer;
			user-select: none;
			transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease, background 120ms ease;
			box-shadow: 0 2px 6px rgba(20, 40, 80, 0.05);
			font-family: "Georgia", "Times New Roman", serif;
		}

		.letter:hover {
			border-color: #4a78d6;
			transform: translateY(-2px);
			box-shadow: 0 6px 14px rgba(20, 40, 80, 0.12);
		}

		.letter:focus-visible {
			outline: 3px solid #4a78d6;
			outline-offset: 2px;
		}

		.letter:active,
		.letter.playing {
			background: #e6efff;
			transform: translateY(0);
		}

		.glyphs {
			font-size: clamp(2rem, 5vw, 2.8rem);
			font-weight: bold;
			line-height: 1;
			letter-spacing: 4px;
			color: #1d3a73;
		}

		.glyphs .lower {
			color: #4a78d6;
		}

		footer {
			text-align: center;
			margin-top: 32px;
			color: #6b7c9e;
			font-size: 0.85rem;
		}

		.unsupported {
			max-width: 600px;
			margin: 0 auto 20px;
			padding: 12px 16px;
			border-radius: 10px;
			background: #fff4d6;
			color: #6b4a00;
			border: 1px solid #f0d27a;
			text-align: center;
			display: none;
		}

		.unsupported.show {
			display: block;
		}
	</style>
</head>
<body>
	<header>
		<h1>English Alphabet with sounds</h1>
		<p class="subtitle">For Educational use &mdash; click any letter to hear its name</p>
	</header>

	<div id="unsupported" class="unsupported">
		Your browser does not support speech synthesis. The letters are still shown, but no sound will play.
	</div>

	<div id="controls" class="controls" hidden>
		<label for="voice-picker">Voice:</label>
		<select id="voice-picker" aria-label="Choose a voice"></select>
		<button id="preview-btn" type="button" class="preview-btn" aria-label="Preview the chosen voice">Preview</button>
	</div>

	<main id="alphabet" class="alphabet" aria-label="English alphabet"></main>

	<footer>
		Tip: try different letters &mdash; sound is generated by your browser's speech engine.
	</footer>

	<script>
		(function () {
			const grid = document.getElementById('alphabet');
			const unsupportedBanner = document.getElementById('unsupported');
			const controls = document.getElementById('controls');
			const voicePicker = document.getElementById('voice-picker');
			const previewBtn = document.getElementById('preview-btn');
			const speechSupported = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';

			let chosenVoice = null;

			// Spoken letter names. Some TTS engines announce a bare uppercase
			// letter as "Capital A" / "Capital B"; sending the phonetic name
			// avoids that and is read consistently across voices.
			const LETTER_NAMES = {
				A: 'ay', B: 'bee', C: 'see', D: 'dee', E: 'ee', F: 'eff',
				G: 'jee', H: 'aitch', I: 'eye', J: 'jay', K: 'kay', L: 'el',
				M: 'em', N: 'en', O: 'oh', P: 'pee', Q: 'cue', R: 'are',
				S: 'ess', T: 'tee', U: 'you', V: 'vee', W: 'double you',
				X: 'ex', Y: 'why', Z: 'zee'
			};

			function letterNameFor(upper) {
				if (upper === 'Z') {
					const lang = (chosenVoice && chosenVoice.lang) || '';
					// "zed" everywhere except North America.
					if (!/^en-(US|CA)\b/i.test(lang)) {
						return 'zed';
					}
				}
				return LETTER_NAMES[upper] || upper;
			}

			// Pretty-print a BCP-47 tag like "en-GB" as "English (United Kingdom)"
			// when the browser supports Intl.DisplayNames; otherwise return the tag.
			let langDisplay = null;
			let regionDisplay = null;
			try {
				if (typeof Intl !== 'undefined' && Intl.DisplayNames) {
					langDisplay = new Intl.DisplayNames(['en'], { type: 'language' });
					regionDisplay = new Intl.DisplayNames(['en'], { type: 'region' });
				}
			} catch (_) {
				// Older browser — fall back to raw tags.
			}

			function prettyLang(tag) {
				if (!tag) {
					return 'Unknown';
				}
				const normalized = tag.replace('_', '-');
				if (!langDisplay) {
					return normalized;
				}
				const parts = normalized.split('-');
				const base = langDisplay.of(parts[0]) || parts[0];
				if (parts.length > 1 && regionDisplay) {
					const region = regionDisplay.of(parts[1]) || parts[1];
					return base + ' (' + region + ')';
				}
				return base;
			}

			function buildVoiceOptions() {
				const voices = window.speechSynthesis.getVoices();
				if (!voices || voices.length === 0) {
					return false;
				}

				// Group every English voice by its language tag.
				// Accepts "en", "en-US", "en-GB", etc. — anything else is skipped.
				const groups = {};
				voices.forEach(function (voice, index) {
					const tag = (voice.lang || '').replace('_', '-');
					if (!/^en(-|$)/i.test(tag)) {
						return;
					}
					if (!groups[tag]) {
						groups[tag] = [];
					}
					groups[tag].push({ index: index, voice: voice });
				});

				const tags = Object.keys(groups).sort(function (a, b) {
					return prettyLang(a).localeCompare(prettyLang(b));
				});

				if (tags.length === 0) {
					return false;
				}

				voicePicker.innerHTML = '';

				const autoOpt = document.createElement('option');
				autoOpt.value = '';
				autoOpt.textContent = 'Default (browser default)';
				voicePicker.appendChild(autoOpt);

				tags.forEach(function (tag) {
					const optgroup = document.createElement('optgroup');
					optgroup.label = prettyLang(tag) + ' [' + tag + ']';
					groups[tag].forEach(function (entry) {
						const opt = document.createElement('option');
						opt.value = String(entry.index);
						const offlineMark = entry.voice.localService ? '' : ' ☁'; // cloud glyph for online voices
						opt.textContent = entry.voice.name + offlineMark;
						optgroup.appendChild(opt);
					});
					voicePicker.appendChild(optgroup);
				});

				// Default: prefer a British male-sounding voice, then any en-GB,
				// then any English, then the first voice on the device.
				const MALE_HINT = /\b(male|david|mark|george|james|daniel|alex|fred|tom|aaron|brian|joey|justin|matthew|geraint|liam|ryan|guy|andrew|eric|william|oliver|arthur|gordon|lee|sean|gary|oscar)\b/i;
				let defaultIndex = null;
				if (groups['en-GB']) {
					const maleMatch = groups['en-GB'].find(function (e) {
						return MALE_HINT.test(e.voice.name) && !/female/i.test(e.voice.name);
					});
					defaultIndex = maleMatch ? maleMatch.index : groups['en-GB'][0].index;
				} else {
					const firstEnglishTag = tags.find(function (t) { return t.toLowerCase().startsWith('en'); });
					if (firstEnglishTag) {
						defaultIndex = groups[firstEnglishTag][0].index;
					} else if (tags.length > 0) {
						defaultIndex = groups[tags[0]][0].index;
					}
				}
				if (defaultIndex !== null) {
					voicePicker.value = String(defaultIndex);
					chosenVoice = voices[defaultIndex];
				}

				controls.hidden = false;
				return true;
			}

			function speakText(text) {
				if (!speechSupported) {
					// Nothing to do — banner already informs the user.
					return;
				}
				window.speechSynthesis.cancel();
				const utterance = new SpeechSynthesisUtterance(text);
				utterance.rate = 0.85;
				utterance.pitch = 1;
				if (chosenVoice) {
					utterance.voice = chosenVoice;
					utterance.lang = chosenVoice.lang;
				} else {
					utterance.lang = 'en-US';
				}
				window.speechSynthesis.speak(utterance);
			}

			function flashPlaying(element) {
				element.classList.add('playing');
				setTimeout(function () {
					element.classList.remove('playing');
				}, 350);
			}

			function buildCells() {
				const fragment = document.createDocumentFragment();
				for (let code = 65; code <= 90; code++) {
					const upper = String.fromCharCode(code);
					const lower = upper.toLowerCase();

					const cell = document.createElement('button');
					cell.type = 'button';
					cell.className = 'letter';
					cell.setAttribute('aria-label', 'Letter ' + upper + ', click to hear');
					cell.dataset.letter = upper;

					const glyphs = document.createElement('div');
					glyphs.className = 'glyphs';
					glyphs.innerHTML = '<span class="upper">' + upper + '</span><span class="lower">' + lower + '</span>';

					cell.appendChild(glyphs);

					cell.addEventListener('click', function () {
						speakText(letterNameFor(upper));
						flashPlaying(cell);
					});

					fragment.appendChild(cell);
				}
				grid.appendChild(fragment);
			}

			if (!speechSupported) {
				unsupportedBanner.classList.add('show');
			} else {
				voicePicker.addEventListener('change', function () {
					const value = voicePicker.value;
					const voices = window.speechSynthesis.getVoices();
					chosenVoice = value === '' ? null : voices[Number(value)] || null;
				});

				previewBtn.addEventListener('click', function () {
					speakText(letterNameFor('A') + ', ' + letterNameFor('B') + ', ' + letterNameFor('C'));
				});

				// Voices load asynchronously on most browsers; the first call to
				// getVoices() often returns an empty list. Try once, then wait
				// for the voiceschanged event.
				if (!buildVoiceOptions()) {
					window.speechSynthesis.addEventListener('voiceschanged', function () {
						buildVoiceOptions();
					});
				}
			}

			buildCells();
		})();
	</script>
</body>
</html>
